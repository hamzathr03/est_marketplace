version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: est_marketplace_app
    container_name: est_marketplace_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "9000:9000"
    networks:
      - est_network
    depends_on:
      - db
  web:
    image: nginx:alpine
    container_name: est_marketplace_web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - est_network


  db:
    image: mysql:8.0
    container_name: est_marketplace_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: est_marketplace
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - est_network

networks:
  est_network:

volumes:
  db_data:
