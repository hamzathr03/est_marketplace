trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: 'Build Docker Images'
    jobs:
      - job: Build
        displayName: 'Build stage'
        steps:
          - checkout: self

          - task: Docker@2
            displayName: 'Build Laravel Docker image'
            inputs:
              command: build
              Dockerfile: Dockerfile
              repository: laravel_app
              tags: latest

          - task: Docker@2
            displayName: 'Build React Docker image'
            inputs:
              command: build
              Dockerfile: frontend/Dockerfile
              repository: react_app
              tags: latest
